name: Docker

on:
  push:
    branches: [ "main"]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate application version
        id: version
        shell: bash
        run: |
          APP_VERSION="$(date -u +'%Y.%m%d').${GITHUB_RUN_NUMBER}"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_revision=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract base image for EddnIndexUpdate
        id: extract-base_update
        shell: python
        env:
          DOCKERFILE: EddnIndexUpdate.Dockerfile
          TARGET_STAGE: final
        run: |
          import re
          import shlex
          import sys
          import os
          from pathlib import Path

          dockerfile = Path(os.environ["DOCKERFILE"])
          target = os.environ["TARGET_STAGE"]

          # Join Dockerfile line continuations.
          logical_lines = []
          pending = ""
          for raw_line in dockerfile.read_text().splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              pending = f"{pending} {line}".strip()
              if pending.endswith("\\"):
                  pending = pending[:-1].rstrip()
                  continue
              logical_lines.append(pending)
              pending = ""

          if pending:
              logical_lines.append(pending)

          stages = []
          for line in logical_lines:
              tokens = shlex.split(line, comments=True)
              if not tokens or tokens[0].upper() != "FROM":
                  continue

              i = 1
              while i < len(tokens) and tokens[i].startswith("--"):
                  i += 1

              image = tokens[i]
              alias = tokens[i + 2] if len(tokens) > i + 2 and tokens[i + 1].upper() == "AS" else str(len(stages))
              stages.append((alias.lower(), image))

          stage_map = dict(stages)
          if target.lower() not in stage_map:
              raise SystemExit(f"Target stage not found: {target}")

          image = stage_map[target.lower()]
          while image.lower() in stage_map:
              image = stage_map[image.lower()]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"image={image}", file=f)

          print(f"Image: {image}")

      - name: Pre-pull and inspect EddnIndexUpdate base image
        id: base_update
        env:
          BASE_IMAGE: ${{ steps.extract-base_update.outputs.image }}
        run: |
          image="${BASE_IMAGE}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          image_inspect_log="$(mktemp "$RUNNER_TEMP/image_inspect.XXXXXX")"
          printf "\x23\x23\x5b%s\x5d%s\n" "group" "Pulling base image"
          echo "[command]docker pull $image"
          docker pull "$image"
          printf "\x23\x23\x5b%s\x5d%s\n" "endgroup" ""
          printf "\x23\x23\x5b%s\x5d%s\n" "group" "Inspecting base image"
          echo "[command]docker image inspect $image"
          docker image inspect "$image" | tee "$image_inspect_log"
          printf "\x23\x23\x5b%s\x5d%s\n" "endgroup" ""
          printf "\x23\x23\x5b%s\x5d%s\n" "group" "Extracting digest from base image"
          digest="$(jq -r '.[0].RepoDigests[0]' "$image_inspect_log")"
          if [[ "${digest}" =~ @(sha256:.*) ]]; then
            digest="${BASH_REMATCH[1]}"
          fi
          echo "Digest: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf "\x23\x23\x5b%s\x5d%s\n" "endgroup" ""

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata for EddnIndexUpdate
        id: meta_update
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-Update
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.app_version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.base.name=${{ steps.base_update.outputs.image }}
            org.opencontainers.image.base.digest=${{ steps.base_update.outputs.digest }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image for EddnIndexUpdate
        id: build-and-push_update
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: EddnIndexUpdate.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_update.outputs.tags }}
          labels: ${{ steps.meta_update.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.app_version }}
            SOURCE_REVISION=${{ steps.version.outputs.source_revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true

      - name: Extract base image for EddnIndexLookup
        id: extract-base_lookup
        shell: python
        env:
          DOCKERFILE: EddnIndexLookup.Dockerfile
          TARGET_STAGE: final
        run: |
          import re
          import shlex
          import sys
          import os
          from pathlib import Path

          dockerfile = Path(os.environ["DOCKERFILE"])
          target = os.environ["TARGET_STAGE"]

          # Join Dockerfile line continuations.
          logical_lines = []
          pending = ""
          for raw_line in dockerfile.read_text().splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              pending = f"{pending} {line}".strip()
              if pending.endswith("\\"):
                  pending = pending[:-1].rstrip()
                  continue
              logical_lines.append(pending)
              pending = ""

          if pending:
              logical_lines.append(pending)

          stages = []
          for line in logical_lines:
              tokens = shlex.split(line, comments=True)
              if not tokens or tokens[0].upper() != "FROM":
                  continue

              i = 1
              while i < len(tokens) and tokens[i].startswith("--"):
                  i += 1

              image = tokens[i]
              alias = tokens[i + 2] if len(tokens) > i + 2 and tokens[i + 1].upper() == "AS" else str(len(stages))
              stages.append((alias.lower(), image))

          stage_map = dict(stages)
          if target.lower() not in stage_map:
              raise SystemExit(f"Target stage not found: {target}")

          image = stage_map[target.lower()]
          while image.lower() in stage_map:
              image = stage_map[image.lower()]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print(f"image={image}", file=f)

          print(f"Image: {image}")

      - name: Pre-pull and inspect Lookup base image
        id: base_lookup
        env:
          BASE_IMAGE: ${{ steps.extract-base_lookup.outputs.image }}
        run: |
          image="${BASE_IMAGE}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          image_inspect_log="$(mktemp "$RUNNER_TEMP/image_inspect.XXXXXX")"
          printf "\x23\x23\x5b%s\x5d%s\n" "group" "Pulling base image"
          echo "[command]docker pull $image"
          docker pull "$image"
          printf "\x23\x23\x5b%s\x5d%s\n" "endgroup" ""
          printf "\x23\x23\x5b%s\x5d%s\n" "group" "Inspecting base image"
          echo "[command]docker image inspect $image"
          docker image inspect "$image" | tee "$image_inspect_log"
          printf "\x23\x23\x5b%s\x5d%s\n" "endgroup" ""
          printf "\x23\x23\x5b%s\x5d%s\n" "group" "Extracting digest from base image"
          digest="$(jq -r '.[0].RepoDigests[0]' "$image_inspect_log")"
          if [[ "${digest}" =~ @(sha256:.*) ]]; then
            digest="${BASH_REMATCH[1]}"
          fi
          echo "Digest: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf "\x23\x23\x5b%s\x5d%s\n" "endgroup" ""

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata for EddnIndexLookup
        id: meta_lookup
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-Lookup
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.app_version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
            org.opencontainers.image.base.name=${{ steps.base_lookup.outputs.image }}
            org.opencontainers.image.base.digest=${{ steps.base_lookup.outputs.digest }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image for EddnIndexLookup
        id: build-and-push_lookup
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: EddnIndexLookup.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_lookup.outputs.tags }}
          labels: ${{ steps.meta_lookup.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.app_version }}
            SOURCE_REVISION=${{ steps.version.outputs.source_revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true

